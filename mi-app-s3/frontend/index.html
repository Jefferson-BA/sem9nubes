<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Galeria de Imagenes - Lab S3</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Mi Galería Segura en S3</h1>
    
    <div class="upload-section">
      <input type="file" id="file" accept="image/jpeg,image/png,image/webp">
      <button id="uploadBtn">Subir Imagen</button>
      <div id="status"></div>
    </div>

    <h2>Imágenes Subidas</h2>
    <div id="gallery" class="gallery"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
